name: release

# Push a tag that matches the version in Cargo.toml to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Cheap guard, run before the three long builds: a tag that disagrees with
  # Cargo.toml would ship archives named for a different version.
  verify:
    name: verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: /Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Compare versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${version}"
            exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      bundle_assets: true

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: realistic-forest-*
          path: dist
          merge-multiple: true

      - name: Create release
        run: |
          cat > notes.md <<'EOF'
          ## Running

          Extract the archive and run `realistic_forest` from inside the extracted folder. It loads shaders and textures from the `assets` folder next to it. A Vulkan, Metal or D3D12 capable GPU is required.

          - **macOS**: the build is not signed. Clear the download quarantine flag once with `xattr -dr com.apple.quarantine <extracted folder>`.
          - **Linux**: needs Vulkan drivers plus the ALSA, udev and X11 or Wayland libraries.

          ---

          EOF

          flags=()
          case "${TAG}" in
            *-*) flags+=(--prerelease) ;;
          esac

          # Created as a draft so a failed upload never leaves a half-attached
          # release public; it is published once every archive is attached.
          gh release create "${TAG}" dist/* \
            --draft --verify-tag --generate-notes --notes-file notes.md "${flags[@]}"
          gh release edit "${TAG}" --draft=false
