name: ci

on:
  push:
    branches: [master]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: clippy, tests and shaders
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Keep in sync with the same step in build.yml.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev

      # Clippy, the tests and wgsl-check all use the dev profile, so one job
      # compiles Bevy once and the three steps share it. Only master saves the
      # cache: a Bevy target directory is several GB and PR branches would
      # otherwise push it out of the 10 GB repository quota.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Fails on compile errors and deny-by-default lints only. The tree has
      # existing clippy warnings, so `-D warnings` is off until they are cleared.
      - name: Clippy
        run: cargo clippy --locked --all-targets

      # The one GPU-dependent test is #[ignore]d, so this runs on a headless
      # runner. Run it by hand on a real adapter with `-- --ignored`.
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: cargo test --locked

      # Parses every assets/shaders/*.wgsl with naga and checks entry points.
      # Shaders are compiled at runtime, so this is the only CI signal for them.
      - name: Validate shaders
        if: ${{ !cancelled() }}
        run: cargo run --locked --bin wgsl-check
