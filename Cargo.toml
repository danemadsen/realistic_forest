[workspace]
resolver = "3"
members = [
    "crates/forest_app",
    "crates/forest_assets",
    "crates/forest_core",
    "crates/forest_water",
    "crates/forest_erosion",
    "crates/forest_vegetation",
    "crates/forest_buildings",
    "crates/forest_world",
    "crates/forest_render",
]
default-members = [
    "crates/forest_app",
    "crates/forest_assets",
    "crates/forest_core",
    "crates/forest_water",
    "crates/forest_erosion",
    "crates/forest_vegetation",
    "crates/forest_buildings",
    "crates/forest_world",
    "crates/forest_render",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# The clipboard backend is needed for the application's pose-copy command.
bevy = { version = "0.19.1", features = ["system_clipboard"] }
bevy_egui = "0.42.0"
quick-noise = "0.3.0"
bytemuck = { version = "1", features = ["derive"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
wgpu = "29.0.3"
naga = { version = "29.0.3", features = ["wgsl-in"] }
log = "0.4"
image = "0.25"
chrono = "0.4"
# Paks retain ZIP checksums and independently Zstandard-compressed files.
zip = { version = "9.1.1", default-features = false, features = ["zstd"] }
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
