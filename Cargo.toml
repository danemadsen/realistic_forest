[package]
name = "realistic_forest"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.17.3"
bevy_egui = "0.38.1"
quick-noise = "0.2.0"
bytemuck = { version = "1", features = ["derive"] }

wgpu = "26.0.1"
naga = { version = "26.0.0", features = ["wgsl-in"] }

log = "0.4"
image = "0.25"
chrono = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3