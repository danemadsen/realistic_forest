[package]
name = "realistic_forest"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.17.3"
bevy_egui = "0.38.1"
quick-noise = "0.2.0"
bytemuck = { version = "1", features = ["derive"] }

wgpu = "26.0.1"
naga = { version = "26.0.0", features = ["wgsl-in"] }

log = "0.4"
image = "0.25"
chrono = "0.4"

# The runtime GLB reader (`src/render/glb.rs`). Only the JSON chunk of the
# container is parsed with it — accessors are read straight out of the binary
# chunk by offset — so this is `serde_json::Value` navigation, not a derive
# surface. Already in the lock as a bevy dependency, so nothing new is built.
serde_json = "1"

# macOS only, and only for `clamp_to_primary_work_area`: raylib clamps
# `InitWindow`'s screen size to the primary monitor's work area before creating
# the window, and `NSScreen.visibleFrame` is the only way to read that — winit
# exposes no work-area query at all. Both crates are already in the tree via
# accesskit/arboard (objc2 0.6.4, objc2-app-kit 0.3.2), so no versions move.
# `default-features = false` matters: objc2-app-kit's defaults are the whole
# AppKit surface, and taking them pulls in a dozen more objc2-* crates
# (quartz-core, core-text, cloud-kit, ...) that this one call never touches.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSScreen",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3